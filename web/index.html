<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 语音助手</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <div class="app">
    <div class="stage-wrap">
      <canvas id="live2d-canvas"></canvas>
      <div id="fallback-avatar" class="fallback-avatar idle">助手待机中</div>
    </div>
    <div class="status">
      <div id="conn-status">连接中...</div>
      <div id="talk-status">状态: 待机</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
